<body>
  <div id="app"></div>
  <script>
    "use strict";

    // Altere estas constantes caso a API ou o WhatsApp da loja mudem.
    const API_BASE_URL = "https://eternallegacy-production.up.railway.app/api";
    const WHATSAPP_NUMBER = "5511987378659";
    const CART_KEY = "eternal-legacy-cart";
    const TOKEN_KEY = "adminToken";
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    const MAX_COMPRESSED_BYTES = 1024 * 1024;
    const MAX_IMAGE_DIMENSION = 1600;
    const app = document.getElementById("app");
    const state = {
      route: routeFromHash(),
      cart: readCart(),
      products: [],
      productsLoading: false,
      productsError: "",
      toastMessage: "",
      modal: null,
      adminAuthenticated: false,
      adminChecking: false,
      adminCheckedToken: "",
      adminSection: "produtos",
      adminProducts: [],
      adminProductSearch: "",
      adminStatusFilters: { disponivel: true, reservado: true },
      adminLoading: false,
      adminError: "",
      adminMessage: "",
      adminBusy: false,
      pendingStatuses: {},
      selectedFile: null,
      previewUrl: "",
      uploadResult: null
    };
    let memoryToken = "";
    let requestVersion = 0;
    let toastTimer = null;

    function routeFromHash() {
      const path = location.hash.replace(/^#/, "").split("?")[0] || "/";
      return path.startsWith("/") ? path : `/${path}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function readCart() {
      try {
        const saved = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(saved)
          ? saved.filter((item) => item && Number.isSafeInteger(item.id) && item.id > 0)
          : [];
      } catch {
        return [];
      }
    }

    function saveCart() {
      try {
        localStorage.setItem(CART_KEY, JSON.stringify(state.cart));
      } catch {
        // A sessão sem storage continua funcional até a página ser fechada.
      }
    }

    function readToken() {
      try {
        return sessionStorage.getItem(TOKEN_KEY) || memoryToken;
      } catch {
        return memoryToken;
      }
    }

    function writeToken(token) {
      memoryToken = token;
      try {
        sessionStorage.setItem(TOKEN_KEY, token);
      } catch {
        // Mantém o login em memória se o navegador bloquear sessionStorage.
      }
    }

    function clearToken() {
      memoryToken = "";
      try {
        sessionStorage.removeItem(TOKEN_KEY);
      } catch {
        // Não há token persistido para limpar quando storage está bloqueado.
      }
    }

    function tokenIsValid(token) {
      try {
        const encoded = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        const payload = JSON.parse(atob(encoded));
        return Number.isFinite(payload.exp) && payload.exp * 1000 > Date.now();
      } catch {
        return false;
      }
    }

    async function apiRequest(path, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      const headers = new Headers(options.headers || {});
      const token = readToken();
      if (token) headers.set("Authorization", `Bearer ${token}`);
      try {
        const response = await fetch(`${API_BASE_URL}${path}`, {
          ...options,
          headers,
          signal: controller.signal
        });
        const contentType = response.headers.get("content-type") || "";
        const data = contentType.includes("application/json") ? await response.json() : null;
        if (!response.ok) {
          const error = new Error(data?.mensagem || "Não foi possível concluir a solicitação.");
          error.status = response.status;
          error.data = data;
          throw error;
        }
        return data;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error("A API demorou para responder. Verifique sua conexão e tente novamente.");
        }
        if (error instanceof TypeError) {
          throw new Error("Não foi possível conectar à loja. Verifique se a API está em execução.");
        }
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    const formatPrice = (value) => value.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const calculateTotal = (quantity) => Math.floor(quantity / 5) * 100 + (quantity % 5) * 25;
    const phoneDigits = (value) => value.replace(/\D/g, "").slice(0, 11);

    function formatPhone(value) {
      const digits = phoneDigits(value);
      if (digits.length <= 2) return digits ? `(${digits}` : "";
      if (digits.length <= 7) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
      const splitAt = digits.length === 11 ? 7 : 6;
      return `(${digits.slice(0, 2)}) ${digits.slice(2, splitAt)}-${digits.slice(splitAt)}`;
    }

    function checkoutPodeEnviar(checkout) {
      if (!checkout || checkout.busy || checkout.cepLoading) return false;
      const nome = String(checkout.nome || "").trim();
      const telefone = phoneDigits(String(checkout.telefone || ""));
      const cep = String(checkout.cep || "").replace(/\D/g, "");
      const numero = String(checkout.numero || "").trim();
      const address = checkout.endereco;
      return nome.length > 0 &&
        telefone.length >= 10 && telefone.length <= 11 && telefone[0] !== "0" &&
        cep.length === 8 && address?.cep === cep &&
        Boolean(address.cidade?.trim()) && /^[A-Z]{2}$/.test(address.uf || "") &&
        numero.length > 0;
    }

      const button = app.querySelector("#checkout-form button[type='submit']");

                <div class="cart-summary-total"><span>Total da reserva</span><strong>${formatPrice(total)}</strong></div>

    function loginPage() {

    }

    function adminPage() {
      if (state.adminChecking) return '<main class="admin-page"><p class="notice">Validando sessão…</p></main>';
      if (!state.adminAuthenticated) return loginPage();

      const pendingCount = Object.keys(state.pendingStatuses).length;
      const products = state.adminProducts.map((product) => {
        const status = state.pendingStatuses[product.id] || product.status;
        const statusLabel = status === "disponivel" ? "Disponível" : "Reservado";
        return `<article class="admin-product ${state.pendingStatuses[product.id] ? "modified" : ""}" data-product-id="${product.id}" data-product-status="${status}">
          <img src="${escapeHtml(product.imagem)}" alt="Gravata ${product.id}">
          <div class="admin-product-info">
            <span class="item-id">PEÇA #${product.id}</span>

          </div>

      }).join("");
      let content;
      if (state.adminSection === "adicionar") {
        content = `<section class="admin-section">
          <span class="eyebrow">CATÁLOGO</span><h1>Adicionar gravata</h1>

            ${state.previewUrl ? `<img class="admin-preview" src="${state.previewUrl}" alt="Prévia da gravata selecionada">` : ""}
            <button class="primary" ${state.adminBusy || !state.selectedFile ? "disabled" : ""}>${state.adminBusy ? "Enviando…" : "Adicionar produto"}</button>
          </form>
        </section>`;
      } else {
        content = `<section class="admin-section">
          <span class="eyebrow">INVENTÁRIO</span><h1>Todos os produtos</h1>
          ${state.adminError ? `<p class="error notice" role="alert">${escapeHtml(state.adminError)}</p>` : ""}
          ${state.adminLoading ? '<p class="notice">Carregando produtos…</p>' : state.adminProducts.length === 0 ? '<p class="notice">Nenhum produto cadastrado.</p>' : `
            <div class="admin-filters">
              <label class="admin-search" for="admin-product-search">Pesquisar pelo ID
                <input id="admin-product-search" type="search" inputmode="numeric" placeholder="Ex.: 123" value="${escapeHtml(state.adminProductSearch)}">
              </label>
              <div class="admin-status-filters" aria-label="Filtrar produtos por status">
                <label><input type="checkbox" data-status-filter="disponivel" ${state.adminStatusFilters.disponivel ? "checked" : ""}> Disponível</label>
                <label><input type="checkbox" data-status-filter="reservado" ${state.adminStatusFilters.reservado ? "checked" : ""}> Reservado</label>
              </div>
              <p class="admin-filter-count" aria-live="polite"></p>
            </div>
            <div class="admin-grid">${products}</div>
            <p class="notice admin-no-filter-results" hidden>Nenhum produto corresponde à pesquisa e aos filtros selecionados.</p>`}
        </section>`;
      }

      return `<main class="admin-page">
        <header class="admin-topbar">
          <a class="brand" href="#/">ETERNAL <span>LEGACY</span><small>ADMIN</small></a>
          <div class="admin-top-actions">
            ${pendingCount ? `<span class="pending-label">${pendingCount} alteração(ões) pendente(s)</span><button class="primary save-button" data-action="save-statuses" ${state.adminBusy ? "disabled" : ""}>${state.adminBusy ? "Salvando…" : "Salvar alterações"}</button>` : ""}
            <button class="link-btn" data-action="logout">Sair</button>
          </div>
        </header>
        <div class="admin-layout">
          <aside class="admin-menu" aria-label="Menu administrativo">
            <button class="${state.adminSection === "produtos" ? "active" : ""}" data-action="admin-section" data-section="produtos">Exibir produtos</button>
            <button class="${state.adminSection === "adicionar" ? "active" : ""}" data-action="admin-section" data-section="adicionar">Adicionar produtos</button>
          </aside>
          <section class="admin-content">
            ${state.adminMessage ? `<p class="success notice" role="status">${escapeHtml(state.adminMessage)}</p>` : ""}
            ${content}
          </section>
        </div>
        ${adminModal()}
      </main>`;
    }

    function adminModal() {
      if (state.modal?.type === "welcome") {
        return modal("Bem-vindo", '<p>Você entrou no painel administrativo da loja.</p><button class="primary" data-action="close-modal">Continuar</button>');
      }
      if (state.modal?.type === "status") {
        const product = state.modal.product;
        const selected = state.modal.selected;
        return modal(`Alterar status da peça #${product.id}`, `<div class="form-stack">
          <label>Novo status<select id="new-status">
            <option value="disponivel" ${selected === "disponivel" ? "selected" : ""}>Disponível</option>
            <option value="reservado" ${selected === "reservado" ? "selected" : ""}>Reservado</option>
          </select></label>
          <div class="modal-actions"><button class="secondary" data-action="close-modal">Cancelar</button><button class="primary" data-action="apply-status">Aplicar alteração</button></div>
        </div>`);
      }
      if (state.modal?.type === "delete-product") {
        const { product, busy, error } = state.modal;
        return modal("Excluir produto", `<p>Tem certeza de que deseja excluir a gravata #${product.id}? Esta ação remove o produto e sua imagem do banco de dados e não pode ser desfeita.</p>
          ${error ? `<p class="error" role="alert">${escapeHtml(error)}</p>` : ""}
          <div class="modal-actions">
            <button class="secondary" data-action="close-modal" ${busy ? "disabled" : ""}>Cancelar</button>
            <button class="primary danger" data-action="confirm-delete" ${busy ? "disabled" : ""}>${busy ? "Excluindo…" : "Excluir permanentemente"}</button>
          </div>`, { closable: !busy });
      }
      if (state.modal?.type === "upload-result") {
        return modal(state.modal.title, `<p>${escapeHtml(state.modal.message)}</p><button class="primary" data-action="close-modal">Fechar</button>`);
      }
      return "";
    }

    function render() {
      state.route = routeFromHash();
      if (state.route === "/") renderStore();
      else if (state.route === "/carrinho") renderCart();
      else app.innerHTML = '<main class="empty-state"><h1>Página não encontrada</h1><a href="#/">Voltar à loja</a></main>';

      applyAdminProductFilters();

      const dialog = app.querySelector('[role="dialog"]');
      if (dialog) {
        dialog.focus();
        const autofocus = dialog.querySelector("[autofocus]");
        if (autofocus) autofocus.focus();
      }
    }

    function applyAdminProductFilters() {
      const grid = app.querySelector(".admin-grid");
      if (!grid) return;

      const search = state.adminProductSearch.trim();
      const cards = [...grid.querySelectorAll(".admin-product")];
      let visibleCount = 0;
      cards.forEach((card) => {
        const matchesId = card.dataset.productId.includes(search);
        const matchesStatus = state.adminStatusFilters[card.dataset.productStatus];
        card.hidden = !matchesId || !matchesStatus;
        if (!card.hidden) visibleCount += 1;
      });

      const count = app.querySelector(".admin-filter-count");
      if (count) count.textContent = visibleCount === 1 ? "1 produto exibido" : `${visibleCount} produtos exibidos`;
      const emptyState = app.querySelector(".admin-no-filter-results");
      if (emptyState) emptyState.hidden = visibleCount > 0;
    }

    async function loadStoreProducts() {
      const version = ++requestVersion;
      state.productsLoading = true;
      state.productsError = "";
      render();
      try {
        const data = await apiRequest("/produtos?status=disponivel");
        if (version !== requestVersion || routeFromHash() !== "/") return;
        state.products = data.dados || [];
      } catch (error) {
        if (version !== requestVersion || routeFromHash() !== "/") return;
        state.productsError = error.message;
      } finally {
        if (version === requestVersion && routeFromHash() === "/") {
          state.productsLoading = false;
          render();
        }
      }
    }

    async function loadAdminProducts() {
      state.adminLoading = true;
      state.adminError = "";
      render();
      try {
        const data = await apiRequest("/produtos");
        state.adminProducts = data.dados || [];
      } catch (error) {
        if (error.status === 401) {
          logout();
          return;
        }
        state.adminError = error.message;
      } finally {
        state.adminLoading = false;
        if (routeFromHash() === "/admin" && state.adminAuthenticated) render();
      }
    }

    async function renderAdmin() {
      render();
      if (state.adminChecking || state.adminCheckedToken === readToken()) return;

      const token = readToken();
      state.adminCheckedToken = token;
      if (!token || !tokenIsValid(token)) {
        clearToken();
        state.adminAuthenticated = false;
        render();
        return;
      }

      state.adminChecking = true;
      render();
      try {
        await apiRequest("/auth/me");
        if (routeFromHash() !== "/admin") return;
        state.adminAuthenticated = true;
        await loadAdminProducts();
      } catch {
        clearToken();
        state.adminAuthenticated = false;
      } finally {
        state.adminChecking = false;
        if (routeFromHash() === "/admin") render();
      }
    }

    function openRoute() {
      const previousRoute = state.route;
      state.route = routeFromHash();
      state.modal = null;
      if (previousRoute === "/admin" && state.route !== "/admin" && Object.keys(state.pendingStatuses).length) {
        state.pendingStatuses = {};
      }
      render();
      if (state.route === "/" && previousRoute !== "/") loadStoreProducts();
    }

    function logout(confirmChanges = true) {
      if (confirmChanges && Object.keys(state.pendingStatuses).length
        && !window.confirm("Há alterações não salvas. Deseja sair mesmo assim?")) return;
      clearToken();
      state.adminAuthenticated = false;
      state.adminCheckedToken = "";
      state.adminProducts = [];
      state.pendingStatuses = {};
      state.adminError = "";
      state.adminMessage = "";
      state.modal = null;
      render();
    }

    function addToCart(id) {
      const product = state.products.find((item) => item.id === id);
      if (!product || state.cart.some((item) => item.id === id)) return;
      state.cart.push(product);
      saveCart();
      state.toastMessage = "Adicionado com sucesso";
      render();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toastMessage = "";
        toastTimer = null;
        if (routeFromHash() === "/") render();
      }, 2800);
    }

    function removeFromCart(id) {
      state.cart = state.cart.filter((item) => item.id !== id);
      saveCart();
      render();
    }

    async function submitCheckout(form) {
      const values = new FormData(form);
      const name = String(values.get("nome") || "").trim();
      const phone = String(values.get("telefone") || "");
      const cep = String(values.get("cep") || "").replace(/\D/g, "");
      const numero = String(values.get("numero") || "").trim();
      const complemento = String(values.get("complemento") || "").trim();
      const address = { ...state.modal.endereco, cep, numero, complemento };
      const digits = phoneDigits(phone);
      if (!form.reportValidity()) return;
      state.modal = { ...state.modal, type: "checkout", nome: name, telefone: phone, numero, complemento, endereco: address, error: "", busy: false };
      if (!name || !numero) {
        state.modal.error = "Preencha seu nome e o número do endereço.";
        render();
        return;
      }
      if (digits.length < 10 || digits.length > 11 || digits[0] === "0") {
        state.modal.error = "Informe um telefone brasileiro válido com DDD.";
        render();
        return;
      }
      if (cep.length !== 8 || !address.cidade || !address.uf) {
        state.modal.error = "Informe um CEP válido e aguarde o preenchimento do endereço.";
        render();
        return;
      }
      if (!WHATSAPP_NUMBER) {
        state.modal.error = "O WhatsApp da loja ainda não foi configurado.";
        render();
        return;
      }

      state.modal.busy = true;
      render();
      try {
        await apiRequest("/produtos/reservar", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids: state.cart.map(({ id }) => id), nome: name, telefone: phone, endereco: address })
        });
        const itemLines = state.cart.map(({ id }) => `• Gravata #${id} — R$ 25,00`).join("\n");
        const addressLines = [
          `CEP: ${address.cep.replace(/^(\d{5})(\d{3})$/, "$1-$2")}`,
          address.logradouro,
          `Número: ${address.numero}`,
          address.bairro,
          `${address.cidade} - ${address.uf}`,
          address.complemento ? `Complemento: ${address.complemento}` : ""
        ].filter(Boolean);
        const message = [
          "Olá! Gostaria de confirmar minha reserva:",
          `Nome: ${name}`,
          `Telefone: ${phone}`,
          "Endereço de entrega:",
          ...addressLines,
          "Gravatas:",
          itemLines,
          `Total: ${formatPrice(calculateTotal(state.cart.length))}`
        ].join("\n");
        state.cart = [];
        saveCart();
        location.assign(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`);
      } catch (error) {
        state.modal.busy = false;
        const unavailableIds = error.data?.dados?.idsIndisponiveis;
        if (error.status === 409 && Array.isArray(unavailableIds)) {
          const unavailable = new Set(unavailableIds);
          state.cart = state.cart.filter((item) => !unavailable.has(item.id));
          saveCart();
          state.modal.error = `As gravatas ${unavailableIds.map((id) => `#${id}`).join(", ")} não estão mais disponíveis e foram removidas do carrinho.`;
        } else {
          state.modal.error = error.message;
        }
        render();
      }
    }

    async function consultarCep(cep) {
      const checkout = state.modal;
      if (!checkout || checkout.type !== "checkout") return;

      checkout.cepLoading = true;
      checkout.cepError = "";
      checkout.endereco = null;
      const status = app.querySelector("#cep-message");
      const submitButton = app.querySelector("#checkout-form button[type='submit'], #checkout-form button:not([type])");
      const requestId = (checkout.cepRequestId || 0) + 1;
      checkout.cepRequestId = requestId;
      if (status) {
        status.className = "";
        status.setAttribute("role", "status");
        status.textContent = "Consultando CEP…";
      }
      if (submitButton) submitButton.disabled = true;

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`, {
          signal: AbortSignal.timeout(10_000)
        });
        if (!response.ok) throw new Error("Não foi possível consultar o CEP. Tente novamente.");
        const data = await response.json();
        if (state.modal !== checkout || checkout.cepRequestId !== requestId || checkout.cep.replace(/\D/g, "") !== cep) return;
        if (data.erro) throw new Error("CEP não encontrado. Confira os números e tente novamente.");

        checkout.endereco = {
          cep: String(data.cep || "").replace(/\D/g, ""),
          logradouro: String(data.logradouro || ""),
          bairro: String(data.bairro || ""),
          cidade: String(data.localidade || ""),
          uf: String(data.uf || "").toUpperCase(),
          complemento: checkout.complemento || ""
        };
        if (!checkout.endereco.cep || !checkout.endereco.cidade || !checkout.endereco.uf) {
          checkout.endereco = null;
          throw new Error("A consulta não retornou um endereço completo para este CEP.");
        }
        checkout.cepError = "";
        if (status) {
          status.className = "success";
          status.setAttribute("role", "status");
          status.textContent = "Endereço preenchido pelo ViaCEP.";
        }
        for (const field of ["logradouro", "bairro", "cidade", "uf"]) {
          const input = app.querySelector(`[name="${field}"]`);
          if (input) input.value = checkout.endereco[field];
        }
        atualizarBotaoCheckout();
      } catch (error) {
        if (state.modal !== checkout || checkout.cepRequestId !== requestId || checkout.cep.replace(/\D/g, "") !== cep) return;
        checkout.endereco = null;
        checkout.cepError = error.name === "TimeoutError" || error.name === "AbortError"
          ? "A consulta do CEP demorou para responder. Tente novamente."
          : error instanceof TypeError
            ? "Não foi possível conectar ao ViaCEP. Verifique sua conexão e tente novamente."
            : error.message;
        if (status) {
          status.className = "error";
          status.setAttribute("role", "alert");
          status.textContent = checkout.cepError;
        }
      } finally {
        if (state.modal === checkout && checkout.cepRequestId === requestId && checkout.cep.replace(/\D/g, "") === cep) {
          checkout.cepLoading = false;
          atualizarBotaoCheckout();
        }
      }
    }

    function openStatusModal(id) {
      const product = state.adminProducts.find((item) => item.id === id);
      if (!product) return;
      const current = state.pendingStatuses[id] || product.status;
      state.modal = {
        type: "status",
        product,
        selected: current === "disponivel" ? "reservado" : "disponivel"
      };
      render();
    }

    async function saveStatuses() {
      const items = Object.entries(state.pendingStatuses).map(([id, status]) => ({ id: Number(id), status }));
      if (!items.length) return;
      state.adminBusy = true;
      state.adminError = "";
      render();
      try {
        await apiRequest("/produtos/status", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(items)
        });
        state.pendingStatuses = {};
        state.adminMessage = "As alterações de status foram salvas.";
        await loadAdminProducts();
      } catch (error) {
        if (error.status === 401) {
          logout(false);
          return;
        }
        state.adminError = error.message;
      } finally {
        state.adminBusy = false;
        if (routeFromHash() === "/admin") render();
      }
    }

    async function deleteProduct() {
      if (state.modal?.type !== "delete-product" || state.modal.busy) return;
      const { product } = state.modal;
      state.modal.busy = true;
      state.modal.error = "";
      render();
      try {
        await apiRequest(`/produtos/${product.id}`, { method: "PUT" });
        state.adminProducts = state.adminProducts.filter((item) => item.id !== product.id);
        delete state.pendingStatuses[product.id];
        state.cart = state.cart.filter((item) => item.id !== product.id);
        saveCart();
        state.adminMessage = `Produto #${product.id} excluído.`;
        state.modal = null;
      } catch (error) {
        if (error.status === 401) {
          logout(false);
          return;
        }
        state.modal.busy = false;
        state.modal.error = error.message;
      } finally {
        if (routeFromHash() === "/admin") render();
      }
    }

    function validateImage(file) {
      const validTypes = ["image/png", "image/jpeg", "image/webp"];
      if (!validTypes.includes(file.type)) throw new Error("Escolha um arquivo PNG, JPG, JPEG ou WEBP.");
      if (file.size > MAX_IMAGE_BYTES) throw new Error("A imagem deve ter no máximo 5 MB.");
    }

    async function compressImage(file) {
      if (file.size <= MAX_COMPRESSED_BYTES) return file;
      if (!("createImageBitmap" in window) || !("toBlob" in HTMLCanvasElement.prototype)) return file;

      const bitmap = await createImageBitmap(file);
      try {
        const scale = Math.min(1, MAX_IMAGE_DIMENSION / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Não foi possível processar a imagem neste navegador.");
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

        const mime = file.type === "image/png" ? "image/png" : file.type === "image/webp" ? "image/webp" : "image/jpeg";
        let quality = 0.86;
        let blob = await new Promise((resolve) => canvas.toBlob(resolve, mime, quality));
        while (blob && blob.size > MAX_COMPRESSED_BYTES && mime !== "image/png" && quality > 0.45) {
          quality -= 0.12;
          blob = await new Promise((resolve) => canvas.toBlob(resolve, mime, quality));
        }
        if (!blob) throw new Error("Não foi possível comprimir a imagem.");
        return new File([blob], file.name, { type: blob.type, lastModified: Date.now() });
      } finally {
        bitmap.close();
      }
    }

    async function uploadProduct() {
      if (!state.selectedFile) return;
      state.adminBusy = true;
      state.adminError = "";
      state.adminMessage = "";
      render();
      try {
        const file = await compressImage(state.selectedFile);
        const body = new FormData();
        body.append("imagem", file);
        const data = await apiRequest("/produtos", { method: "POST", body });
        clearPreview();
        state.selectedFile = null;
        state.modal = {
          type: "upload-result",
          title: "Sucesso",
          message: `Gravata #${data.dados.id} adicionada com sucesso.`
        };
        await loadAdminProducts();
      } catch (error) {
        if (error.status === 401) {
          logout(false);
          return;
        }
        state.modal = {
          type: "upload-result",
          title: "Falha ao adicionar",
          message: error.message || "Não foi possível comprimir ou enviar a imagem."
        };
      } finally {
        state.adminBusy = false;
        if (routeFromHash() === "/admin") render();
      }
    }

    function clearPreview() {
      if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
      state.previewUrl = "";
    }

    app.addEventListener("pointermove", (event) => {
      if (event.pointerType !== "mouse" || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      const imageArea = event.target.closest(".product-image");
      const image = imageArea?.querySelector(":scope > img");
      if (!image) return;

      const bounds = imageArea.getBoundingClientRect();
      const lensSize = Math.min(136, bounds.width * 0.72, bounds.height * 0.72);
      const radius = lensSize / 2;
      const zoom = 2.4;
      const x = Math.max(radius, Math.min(bounds.width - radius, event.clientX - bounds.left));
      const y = Math.max(radius, Math.min(bounds.height - radius, event.clientY - bounds.top));
      let lens = imageArea.querySelector(".zoom-lens");
      if (!lens) {
        lens = document.createElement("span");
        lens.className = "zoom-lens is-visible";
        lens.setAttribute("aria-hidden", "true");
        const magnifiedImage = image.cloneNode();
        magnifiedImage.removeAttribute("loading");
        magnifiedImage.alt = "";
        lens.append(magnifiedImage);
        imageArea.append(lens);
      }

      lens.style.width = `${lensSize}px`;
      lens.style.height = `${lensSize}px`;
      lens.style.left = `${x - radius}px`;
      lens.style.top = `${y - radius}px`;
      const magnifiedImage = lens.querySelector("img");
      magnifiedImage.style.width = `${bounds.width * zoom}px`;
      magnifiedImage.style.height = `${bounds.height * zoom}px`;
      magnifiedImage.style.left = `${radius - x * zoom}px`;
      magnifiedImage.style.top = `${radius - y * zoom}px`;
    });

    app.addEventListener("pointerleave", (event) => {
      event.target.closest?.(".product-image")?.querySelector(".zoom-lens")?.remove();
    }, true);

    app.addEventListener("click", async (event) => {
      const actionElement = event.target.closest("[data-action]");
      if (actionElement) {
        const action = actionElement.dataset.action;
        const id = Number(actionElement.dataset.id);
        if (action === "add-cart") addToCart(id);
        else if (action === "scroll-collection") app.querySelector("#colecao")?.scrollIntoView({ behavior: "smooth" });
        else if (action === "remove-cart") removeFromCart(id);
        else if (action === "checkout") {
          state.modal = {
            type: "checkout",
            nome: "",
            telefone: "",
            cep: "",
            numero: "",
            complemento: "",
            endereco: null,
            cepLoading: false,
            cepError: "",
            error: "",
            busy: false
          };
          render();
        } else if (action === "close-modal") {
          state.modal = null;
          render();
        } else if (action === "admin-section") {
          state.adminSection = actionElement.dataset.section;
          state.adminMessage = "";
          state.adminError = "";
          render();
          if (state.adminSection === "produtos" && !state.adminProducts.length) await loadAdminProducts();
        } else if (action === "logout") logout();
        else if (action === "change-status") openStatusModal(id);
        else if (action === "delete-product") {
          const product = state.adminProducts.find((item) => item.id === id);
          if (product) {
            state.modal = { type: "delete-product", product, busy: false, error: "" };
            render();
          }
        }
        else if (action === "apply-status") {
          const { product } = state.modal;
          const selected = app.querySelector("#new-status")?.value;
          const original = product.status;
          if (selected === original) delete state.pendingStatuses[product.id];
          else state.pendingStatuses[product.id] = selected;
          state.modal = null;
          state.adminMessage = "";
          render();
        } else if (action === "confirm-delete") {
          await deleteProduct();
        } else if (action === "save-statuses") await saveStatuses();
      }

      if (event.target.matches("[data-backdrop]")) {
        const closeable = !state.modal?.busy && state.modal?.type !== "login";
        if (closeable) {
          state.modal = null;
          render();
        }
      }
    });

    app.addEventListener("input", (event) => {
      if (event.target.id === "admin-product-search") {
        state.adminProductSearch = event.target.value;
        applyAdminProductFilters();
      }
      if (event.target.name === "telefone") {
        const start = event.target.selectionStart;
        const oldLength = event.target.value.length;
        event.target.value = formatPhone(event.target.value);
        const next = Math.max(0, start + event.target.value.length - oldLength);
        event.target.setSelectionRange(next, next);
        if (state.modal?.type === "checkout") state.modal.telefone = event.target.value;
      }
      if (event.target.name === "nome" && state.modal?.type === "checkout") {
        state.modal.nome = event.target.value;
      }
      if (event.target.name === "numero" && state.modal?.type === "checkout") {
        state.modal.numero = event.target.value;
      }
      if (event.target.name === "cep" && state.modal?.type === "checkout") {
        const digits = event.target.value.replace(/\D/g, "").slice(0, 8);
        event.target.value = digits.length > 5 ? `${digits.slice(0, 5)}-${digits.slice(5)}` : digits;
        state.modal.cep = event.target.value;
        state.modal.endereco = null;
        state.modal.cepLoading = false;
        state.modal.cepError = "";
        state.modal.error = "";
        state.modal.cepRequestId = (state.modal.cepRequestId || 0) + 1;
        const message = app.querySelector("#cep-message");
        const submitButton = app.querySelector("#checkout-form button[type='submit'], #checkout-form button:not([type])");
        if (message) {
          message.className = "";
          message.setAttribute("role", "status");
          message.textContent = digits.length === 8 ? "Consultando CEP…" : "Informe o CEP para preencher o endereço.";
        }
        for (const field of ["logradouro", "bairro", "cidade", "uf"]) {
          const input = app.querySelector(`[name="${field}"]`);
          if (input) input.value = "";
        }
        if (submitButton) submitButton.disabled = true;
        if (digits.length === 8) consultarCep(digits);
      }
      if (event.target.name === "complemento" && state.modal?.type === "checkout") {
        state.modal.complemento = event.target.value;
      }
      if (state.modal?.type === "checkout") atualizarBotaoCheckout();
    });

    app.addEventListener("change", (event) => {
      if (event.target.matches("[data-status-filter]")) {
        state.adminStatusFilters[event.target.dataset.statusFilter] = event.target.checked;
        applyAdminProductFilters();
      }
      if (event.target.id === "new-status" && state.modal?.type === "status") {
        state.modal.selected = event.target.value;
      }
      if (event.target.matches('input[name="imagem"]')) {
        clearPreview();
        state.selectedFile = event.target.files?.[0] || null;
        state.adminError = "";
        state.adminMessage = "";
        if (!state.selectedFile) {
          render();
          return;
        }
        try {
          validateImage(state.selectedFile);
          state.previewUrl = URL.createObjectURL(state.selectedFile);
        } catch (error) {
          state.selectedFile = null;
          state.adminError = error.message;
        }
        render();
      }
    });

    app.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (event.target.id === "checkout-form") await submitCheckout(event.target);
      if (event.target.id === "login-form") {
        const form = new FormData(event.target);
        const email = String(form.get("email") || "").trim();
        const senha = String(form.get("senha") || "");
        state.modal = { type: "login", email, busy: true, error: "" };
        render();
        try {
          const data = await apiRequest("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, senha })
          });
          writeToken(data.dados.token);
          state.adminCheckedToken = readToken();
          state.adminAuthenticated = true;
          state.adminChecking = false;
          state.adminSection = "produtos";
          state.pendingStatuses = {};
          state.adminMessage = "";
          state.modal = { type: "welcome" };
          render();
          await loadAdminProducts();
        } catch (error) {
          state.modal = { type: "login", email, busy: false, error: error.message };
          render();
        }
      }
      if (event.target.id === "upload-form") await uploadProduct();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.modal
        && state.modal.type !== "login" && !state.modal.busy) {
        state.modal = null;
        render();
      }
    });

    window.addEventListener("hashchange", openRoute);
    window.addEventListener("beforeunload", (event) => {
      if (state.route === "/admin" && Object.keys(state.pendingStatuses).length) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    render();
    if (state.route === "/") loadStoreProducts();
  </script>
</body>
</html>
